<!-- catalog/templates/catalog/includes/menu.html - ИСПРАВЛЕННАЯ ВЕРСИЯ -->
{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <!-- Логотип и название магазина -->
        <a class="navbar-brand d-flex align-items-center" href="{% url 'catalog:home' %}">  <!-- ✅ ИСПРАВЛЕНО -->
            <span class="fs-3 me-2">🛒</span>
            <span class="fw-bold">Skystore</span>
        </a>

        <!-- Кнопка для мобильного меню -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Основное меню -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <!-- Главная -->
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}"
                       href="{% url 'catalog:home' %}">  <!-- ✅ ИСПРАВЛЕНО -->
                        <i class="bi bi-house-door"></i> Главная
                    </a>
                </li>

                <!-- Блог -->
                <li class="nav-item">
                    <a class="nav-link {% if '/blogs/' in request.path %}active{% endif %}"
                       href="{% url 'blog:blog_list' %}">  <!-- ✅ ЭТО ПРАВИЛЬНО (blog:) -->
                        <i class="bi bi-newspaper"></i> Блог
                    </a>
                </li>

                <!-- Контакты -->
                <li class="nav-item">
                    <a class="nav-link {% if '/contacts/' in request.path %}active{% endif %}"
                       href="{% url 'catalog:contacts' %}">  <!-- ✅ ИСПРАВЛЕНО -->
                        <i class="bi bi-envelope"></i> Контакты
                    </a>
                </li>

                <!-- Выпадающее меню с категориями -->
                {% if categories %}
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        Категории
                    </a>
                    <ul class="dropdown-menu">
                        {% for category in categories %}
                        <li>
                            <a class="dropdown-item" href="{% url 'catalog:home' %}?category={{ category.name }}">{{ category.name }}</a>  <!-- ✅ ИСПРАВЛЕНО -->
                        </li>
                        {% endfor %}
                    </ul>
                </li>
                {% endif %}
            </ul>

            <!-- Правая часть меню -->
            <ul class="navbar-nav">
                <!-- Добавить товар -->
                <li class="nav-item">
                    <a class="nav-link {% if '/product/create/' in request.path %}active{% endif %}"
                       href="{% url 'catalog:product_create' %}">  <!-- ✅ ИСПРАВЛЕНО -->
                        <i class="bi bi-plus-circle"></i> Добавить товар
                    </a>
                </li>

                <!-- Админка -->
                <li class="nav-item">
                    <a class="nav-link" href="/admin/" target="_blank">
                        <i class="bi bi-gear"></i> Админка
                    </a>
                </li>

                <!-- РАБОЧИЙ ПОИСК -->
                <li class="nav-item">
                    <form class="d-flex" role="search" method="get" action="{% url 'catalog:home' %}">  <!-- ✅ ИСПРАВЛЕНО -->
                        <input class="form-control form-control-sm me-2" type="search"
                               name="q" placeholder="Поиск товаров..."
                               value="{{ request.GET.q|default:'' }}">
                        <button class="btn btn-sm btn-outline-light" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Bootstrap Icons (локально или CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
    .navbar-nav .nav-link.active {
        font-weight: bold;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 5px;
    }
    .dropdown-menu .dropdown-item:hover {
        background-color: #f8f9fa;
    }
</style>
